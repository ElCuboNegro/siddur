name: CI

on:
  # Gates run on every PR (any base) and on pushes to the canonical branches,
  # so feature/*, chore/*, etc. are gated on the way into staging — not only
  # at the staging->main release (extends ADR-0107, branch-protection-as-code).
  push:
    branches: [main, staging]
  pull_request:
    branches: ['**']

jobs:
  # ADR: 0159 — server-side co-presence gate on the hardened _gate_core foundation.
  # Real enforcement surface: local hooks are bypassable, so governance is a required check here.
  governance-gate:
    name: Governance Gate (ADR-0159)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Governance gate (self-resolved merge-base; never trusts caller range)
        env:
          # github.event.head_commit no existe en `pull_request` (campo solo de
          # push): COMMIT_MESSAGE llegaba vacio y el marcador de bypass del autor
          # nunca se veia. Se resuelve el commit real del PR (ADR-0202, cornerstone#1029).
          REAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROTECTED_BRANCH: origin/${{ github.event.repository.default_branch }}
        run: |
          export COMMIT_MESSAGE=$(git log -1 --pretty=%B "$REAL_HEAD_SHA")
          python tools/governance_gate.py --check

  adr-gate:
    name: ADR Gate — library changes require a new ADR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"

      - name: Install cornerstone
        env:
          GH_CLASSIC_TOKEN: ${{ secrets.GH_CLASSIC_TOKEN }}
        run: |
          git clone --depth=1 --no-recurse-submodules \
            https://x-access-token:${GH_CLASSIC_TOKEN}@github.com/grupodeacero/cornerstone.git \
            /tmp/cornerstone
          pip install /tmp/cornerstone

      - name: Get changed and new files
        id: diff
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD=${{ github.sha }}
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          NEW=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" 2>/dev/null || git diff --name-only --diff-filter=A HEAD~1 HEAD)
          echo "changed<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "new_files<<EOF" >> $GITHUB_OUTPUT
          echo "$NEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run ADR gate
        # ADR-0202 / cornerstone#1029: github.event.head_commit no existe en
        # `pull_request`, asi que el mensaje llegaba vacio. Se lee el commit real.
        env:
          REAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B "$REAL_HEAD_SHA")
          cornerstone adr-gate \
            --changed-files "${{ steps.diff.outputs.changed }}" \
            --new-files "${{ steps.diff.outputs.new_files }}" \
            --commit-message "$COMMIT_MESSAGE"

      - name: Validate Mermaid Diagrams
        run: cornerstone check-mermaid


  gitflow-gate:
    name: Gitflow Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - name: Install cornerstone
        env:
          GH_CLASSIC_TOKEN: ${{ secrets.GH_CLASSIC_TOKEN }}
        run: |
          git clone --depth=1 --no-recurse-submodules \
            https://x-access-token:${GH_CLASSIC_TOKEN}@github.com/grupodeacero/cornerstone.git \
            /tmp/cornerstone
          pip install /tmp/cornerstone
      - name: Run gitflow-gate
        run: cornerstone gitflow-gate

  semver-gate:
    name: Semver Gate
    runs-on: ubuntu-latest
    # A version bump is a release concern → enforce only when targeting main.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - name: Install cornerstone
        env:
          GH_CLASSIC_TOKEN: ${{ secrets.GH_CLASSIC_TOKEN }}
        run: |
          git clone --depth=1 --no-recurse-submodules \
            https://x-access-token:${GH_CLASSIC_TOKEN}@github.com/grupodeacero/cornerstone.git \
            /tmp/cornerstone
          pip install /tmp/cornerstone
      - name: Run semver-gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # En `pull_request` github.sha es el merge sintetico ('Merge <sha> into
          # <sha>'). El gate lee SOLO el asunto de este commit, asi que un
          # [skip-semver] legitimo del autor nunca se veia (ADR-0202, cornerstone#1029).
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          export BASE_SHA
          cornerstone semver-gate

  commit-gate:
    name: Commit Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hace falta el commit real del PR, no solo el merge ref
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - name: Install cornerstone
        env:
          GH_CLASSIC_TOKEN: ${{ secrets.GH_CLASSIC_TOKEN }}
        run: |
          git clone --depth=1 --no-recurse-submodules \
            https://x-access-token:${GH_CLASSIC_TOKEN}@github.com/grupodeacero/cornerstone.git \
            /tmp/cornerstone
          pip install /tmp/cornerstone
      - name: Run commit-gate
        # ADR-0202 / cornerstone#1029: `git log -1` sobre el arbol montado leia el
        # merge sintetico. Se valida el asunto real del autor.
        env:
          REAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B "$REAL_HEAD_SHA")
          cornerstone commit-gate --message "$COMMIT_MSG"

  bdd-gate:
    name: BDD Gate — archaeology output must have feature files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - name: Install pytest-bdd
        run: pip install pytest pytest-bdd
      - name: BDD gate (output/bdd/features)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # github.event.head_commit no existe en `pull_request` (campo solo de
          # push): COMMIT_MESSAGE llegaba vacio y el marcador de bypass del autor
          # nunca se veia. Se resuelve el commit real del PR (ADR-0202, cornerstone#1029).
          REAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export COMMIT_MESSAGE=$(git log -1 --pretty=%B "$REAL_HEAD_SHA")
          python tools/check_bdd_gate.py --ci --features-dir=output/bdd/features

  sonarqube:
    name: SonarQube — Cognitive Complexity Gate
    runs-on: ubuntu-latest
    needs: [bdd-gate, adr-gate, semver-gate, commit-gate]
    if: ${{ vars.SONAR_HOST_URL != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Provision SonarQube project
        id: provision
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is not configured — skipping SonarQube analysis"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          PROJECT_KEY=$(grep "^sonar.projectKey=" sonar-project.properties | cut -d= -f2)
          PROJECT_NAME=$(grep "^sonar.projectName=" sonar-project.properties | cut -d= -f2)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            -X POST \
            --data-urlencode "name=${PROJECT_NAME}" \
            --data-urlencode "project=${PROJECT_KEY}" \
            "${SONAR_HOST_URL}/api/projects/create")
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 400 ]; then
            echo "SonarQube project provisioning failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "SonarQube project ready (HTTP $HTTP_STATUS)"

      - name: SonarQube Scan
        if: steps.provision.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        if: steps.provision.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
